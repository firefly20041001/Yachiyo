appId: com.yachiyo.app
productName: Yachiyo
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!{electron.vite.config.ts}'
win:
  executableName: Yachiyo
  icon: resources/icon.png
  target:
    - target: dir
      arch:
        - x64
# The Windows installer is produced by Inno Setup from the unpacked app
# above: run `pnpm run build:win`, which invokes build/yachiyo.iss via
# scripts/make-inno-installer.mjs after electron-builder finishes.
